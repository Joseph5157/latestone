<!-- Local sidebar nav icon: My Devices (chip). Same glyph as nav-devices.svg
     on purpose — a Technician's assigned-devices page and an
     Administrator's fleet-wide Devices page are the same kind of
     destination, just role-scoped; a distinct file only exists because
     TestSidebarIcons requires unique slugs per sidebar entry, and the two
     entries are never visible to the same signed-in role at once. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="6" width="12" height="12" rx="2"/>
  <rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
  <path d="M9 2v3M12 2v3M15 2v3M9 19v3M12 19v3M15 19v3M2 9h3M2 12h3M2 15h3M19 9h3M19 12h3M19 15h3"/>
</svg>
