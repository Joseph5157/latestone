services:
  postgres:
    image: postgres:16
    # Overridable so an isolated checkout/worktree can run its own stack
    # alongside another one without a container-name collision.
    container_name: ${POSTGRES_CONTAINER_NAME:-powerplant_demo_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerplant_demo}
      POSTGRES_USER: ${POSTGRES_USER:-powerplant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      # The init script creates the schema under this name, so the DDL and the
      # application's PLANT_MONITORING_SCHEMA can never disagree.
      PLANT_MONITORING_SCHEMA: ${PLANT_MONITORING_SCHEMA:-plant_monitoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - powerplant_pgdata:/var/lib/postgresql/data
      # The template is not named *.sql, so postgres runs only the script,
      # which substitutes the schema name before piping the DDL to psql.
      - ./db/init_plant_monitoring.sh:/docker-entrypoint-initdb.d/01_init_plant_monitoring.sh:ro
      - ./db/init_plant_monitoring.sql.template:/docker-entrypoint-initdb.d/init_plant_monitoring.sql.template:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerplant} -d ${POSTGRES_DB:-powerplant_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ${PGADMIN_CONTAINER_NAME:-powerplant_pgadmin}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@powerplant.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme_local_only}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  powerplant_pgdata:
