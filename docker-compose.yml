services:
  postgres:
    image: postgres:16
    # Overridable so an isolated checkout/worktree can run its own stack
    # alongside another one without a container-name collision.
    container_name: ${POSTGRES_CONTAINER_NAME:-powerplant_demo_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerplant_demo}
      POSTGRES_USER: ${POSTGRES_USER:-powerplant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      # PLANT_MONITORING_SCHEMA is deliberately NOT passed to the container.
      # The schema is created by `alembic upgrade head`, which reads the value
      # from config.settings in the *application's* environment. Handing it to
      # postgres as well would imply the container has a say in where schema
      # lives, and that second opinion is exactly what BOOTSTRAP-1 removed.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Data only. Nothing is mounted into /docker-entrypoint-initdb.d: this
      # container starts an EMPTY database and Alembic builds every table in
      # it. Mounting schema DDL here made postgres create the baseline tables
      # that 001_baseline then tried to create again, so `alembic upgrade head`
      # failed on any fresh clone. See tests/test_bootstrap_contract.py.
      - powerplant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerplant} -d ${POSTGRES_DB:-powerplant_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ${PGADMIN_CONTAINER_NAME:-powerplant_pgadmin}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@powerplant.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme_local_only}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Local, restored copy of the final client RTL SQL Server database.
  # It is deliberately separate from the application-owned PostgreSQL service.
  rtl_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${RTL_SQLSERVER_CONTAINER_NAME:-client_rtl_sqlserver}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RTL_SQL_SA_PASSWORD:?Set RTL_SQL_SA_PASSWORD in ignored .env}
    ports:
      # Bind only to loopback: the restored client database is never public.
      - "127.0.0.1:${RTL_DB_PORT:-14333}:1433"
    volumes:
      # Docker-managed persistence: no database files enter the Git worktree.
      - client_rtl_sqlserver_data:/var/opt/mssql
      # Evidence only: no image bake/copy and no write access to the backup.
      - ./RTL.bak:/var/opt/mssql/backup/RTL.bak:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  powerplant_pgdata:
  client_rtl_sqlserver_data:
